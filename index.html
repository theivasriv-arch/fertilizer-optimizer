<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Fertilizer Recommendation</title>
</head>
<body>
    <h2>Smart Fertilizer Recommendation System</h2>
    <form action="/predict" method="POST">
        <label>Soil pH (3.0 - 10.0):</label><br>
        <input type="number" step="0.1" name="Soil_pH" placeholder="e.g., 6.5" required><br><br>

        <label>Nitrogen Level (N):</label><br>
        <input type="number" name="Nitrogen_Level" placeholder="e.g., 50" required><br><br>

        <label>Phosphorus Level (P):</label><br>
        <input type="number" name="Phosphorus_" placeholder="e.g., 40" required><br><br>

        <label>Potassium Level (K):</label><br>
        <input type="number" name="Potassium" placeholder="e.g., 40" required><br><br>

        <label>Temperature (°C):</label><br>
        <input type="number" step="0.1" name="Temperature" placeholder="e.g., 25.5" required><br><br>

        <label>Rainfall (mm):</label><br>
        <input type="number" step="0.1" name="Rainfall" placeholder="e.g., 1000" required><br><br>

        <button type="submit">Predict Fertilizer</button>
    </form>

    {% if prediction_text %}
        <h3>{{ prediction_text }}</h3>
    {% endif %}
</body>
</html>
